name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: webufw-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must be vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check installer and Go code
        run: |
          set -euo pipefail
          bash -n install.sh scripts/package-release.sh tests/install_test.sh
          bash tests/install_test.sh
          go vet ./...

      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package-release.sh "$RELEASE_TAG"

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "dist/$RELEASE_TAG"
          sha256sum -c SHA256SUMS
          # Exercise the private web process without starting the root agent.
          WEBUFW_PROCESS=web WEBUFW_LISTEN=127.0.0.1:18088 ./webufw-linux-amd64 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true; wait "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            kill -0 "$web_pid"
            if curl --noproxy '*' -fsS --max-time 2 http://127.0.0.1:18088/ -o /tmp/webufw-release-page.html; then
              break
            fi
            sleep 0.2
          done
          kill -0 "$web_pid"
          grep -F "<footer>WebUFW <span>$RELEASE_TAG</span>" /tmp/webufw-release-page.html
          test -s webufw-linux-arm64

      - name: Save assets for publication
        uses: actions/upload-artifact@v7
        with:
          name: webufw-release-assets
          path: dist/${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@v8
        with:
          name: webufw-release-assets
          path: release

      - name: Verify transferred assets
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          for asset in webufw-linux-amd64 webufw-linux-arm64; do
            test -s "$asset"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release/webufw-linux-amd64 \
            release/webufw-linux-arm64 \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes
